    internet: true
    machine: physical
    encryption: none
    owner: End user
    confidentiality: confidential
    integrity: important
    availability: operational
    justification_cia_rating: Holds session state and displayed business data on an uncontrolled device.
    multi_tenant: false
    redundant: false
    custom_developed_parts: true
    data_assets_processed:
      - session-credentials
      - business-data
    data_assets_stored:
    data_formats_accepted:
      - json
    communication_links:
      Load SPA:
        target: spa-host
        description: Download of the static Angular bundle.
        protocol: https
        authentication: none
        authorization: none
        tags:
        vpn: false
        ip_filtered: false
        readonly: true
        usage: business
        data_assets_sent:
        data_assets_received:
      API Calls:
        target: backend-api
        description: Authenticated REST calls from the SPA.
        protocol: https
        authentication: token
        authorization: enduser-identity-propagation
        tags:
          - assumed
        vpn: false
        ip_filtered: false
        readonly: false
        usage: business
        data_assets_sent:
          - session-credentials
          - business-data
        data_assets_received:
          - business-data
      Login:
        target: identity-provider
        description: User sign-in using the chosen OIDC or session flow.
        protocol: https
        authentication: credentials
        authorization: none
        tags:
          - assumed
        vpn: false
        ip_filtered: false
        readonly: false
        usage: business
        data_assets_sent:
        data_assets_received:
          - session-credentials
      Send Telemetry:
        target: telemetry-collector
        description: Browser error and performance reports.
        protocol: https
        authentication: none
        authorization: none
        tags:
          - assumed
        vpn: false
        ip_filtered: false
        readonly: false
        usage: devops
        data_assets_sent:
          - client-telemetry
        data_assets_received:

