threagile_version: 1.0.0

title: SDLC Sample Angular SPA
date: 2026-10-06

author:
  name: Application Security Owner (TBD)
  homepage: https://example.invalid

management_summary_comment: >
  Initial model. The backend API, identity provider and telemetry collector are
  ASSUMED components (see SECURITY-APPLICATION-PLAN.md section 2) and
  must be confirmed or removed before this model is relied on.

business_criticality: important # archive, operational, important, critical, mission-critical

business_overview:
  description: >
    Angular single-page application served to browsers. Business functions,
    user roles and data sensitivity are to be confirmed in the discovery phase.
  images:

technical_overview:
  description: >
    Static Angular bundle served over HTTPS. The browser runs the SPA and calls
    an assumed backend API, authenticating through an assumed identity provider.
    Browser errors are sent to an assumed telemetry collector.
  images:

questions:
  Which user roles and privileged actions exist?: ''
  Is a backend API required, and who owns it?: ''
  Which identity provider and session or token model will be used?: ''
  What personal or regulated data will be processed?: ''

abuse_cases:
  Cross-Site Scripting: >
    Attacker injects script through unsanitized content to steal sessions or act as the user.
  Account Takeover: >
    Attacker abuses weak authentication, token theft or session fixation to impersonate a user.
  Broken Object Level Authorization: >
    Authenticated user reads or changes another user's data by manipulating identifiers.
  Software Supply Chain Compromise: >
    Malicious or vulnerable npm dependency or CI change ships attacker code in the bundle.
  Sensitive Data in Telemetry: >
    Tokens or personal data are captured in browser logs or error reports.

security_requirements:
  Server-side authorization: All access decisions are enforced by the backend; route guards are UX only.
  No secrets in the bundle: The Angular build output is public and must contain no secrets.
  Content Security Policy: A strict CSP is deployed, starting in report-only mode.
  Sanitized telemetry: Logs and error reports exclude tokens, cookies and unneeded personal data.

tags_available:
  - angular
  - assumed

data_assets:
  User Session Credentials:
    id: session-credentials
    description: Session cookie or access token identifying the user.
    usage: business
    tags:
    origin: Identity provider
    owner: TBD
    quantity: many
    confidentiality: strictly-confidential
    integrity: critical
    availability: important
    justification_cia_rating: Theft allows full impersonation of the user.

  Business Data:
    id: business-data
    description: Application data shown and edited by users. Classification pending discovery.
    usage: business
    tags:
    origin: Users and backend
    owner: TBD
    quantity: many
    confidentiality: confidential
    integrity: critical
    availability: important
    justification_cia_rating: Provisional rating until data classification is complete.

  Client Telemetry:
    id: client-telemetry
    description: Browser error reports and performance events.
    usage: devops
    tags:
    origin: Browser
    owner: TBD
    quantity: many
    confidentiality: internal
    integrity: operational
    availability: operational
    justification_cia_rating: Must be free of credentials and personal data.

technical_assets:
